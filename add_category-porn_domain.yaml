payload:
    # =================================================================
    # 一、草榴专用 / 华人圈自建高频图床 (官方 category-porn 规则盲区，必须补充)
    # =================================================================
    #- +.giphy.com              # 图片流
    #- +.makeagif.com           # 图片流
    #- +.imagebam.com           # 图片流 (老牌成人/福利图床)
    # - +.imageshack.com        # 图片流 (经典海外图床)
    # 1. 数字系列与草榴主流专用图床
    - +.66img.cc               # 图片流 | 草榴顶置/发帖极高频，国内直连优化，但屏蔽香港 IP
    - +.88img.cc               # 图片流 | 66img 核心同系列备用/衍生域名
    - +.99img.cc               # 图片流 | 66img 核心同系列备用/衍生域名
    - +.77img.cc               # 图片流 | 数字图床同系列高频分流域名
    - +.00img.cc               # 图片流 | 数字图床同系列高频分流域名
    - +.1024image.com          # 图片流 | 带有强烈论坛色彩的自建专属贴图床
    - +.11img.com              # 图片流 | 早期至今仍高频活跃的自建华人图床
    - +.23img.com              # 图片流 | 23img 华人免费图床，CL老牌发帖常用
    - +.sda1.dev               # 图片流 | 华人圈颇具名气的“去不图床”，CL多板块通用
    - +.lefu.men               # 图片流 | 华人自建福利图床，常用于达人贴、精选贴

    # 2. 华语圈常见自建与 Chevereto 托管站点
    - +.imgtp.com              # 图片流 | 图壳图床，国内加载速度快的自建贴图站
    - +.tpimg.cc               # 图片流 | 华人维护的专用图片托管服务
    - +.imgtg.com              # 图片流 | TG自建流衍生的华人免费图床
    - +.picgo.net              # 图片流 | 常见华人自建图床，兼容各类上传工具的分发流
    - +.acg.lol                # 图片流 | 二次元/福利综合型贴图自建床

    # =================================================================
    # 二、国际常青树与福利图床 (已去重，CL欧美区/高清区发帖主力)
    # =================================================================
    - +.imgbox.com             # 图片流 | 元老级国际大图床，CL欧美高清资源区存量极多，经久不衰
    - +.pixhost.to             # 图片流 | 欧美及华人成人社区御用贴图床，速度快且稳定
    - +.postimages.org         # 图片流 | 国际老牌免注册大图床，分发量及存量极大
    - +.postimg.cc             # 图片流 | Postimages 核心直链与分流后缀域名
    - +.imgbb.com              # 图片流 | 全球性主流图床，CL各类自发贴极常用
    - +.ibb.co                 # 图片流 | ImgBB 的官方短链接、直链加速域名
    - +.im.ge                  # 图片流 | im.ge 国际无损无压缩大图床，常用于高清大图分享
    - +.freeimage.host         # 图片流 | 海外免费大图床，CL达人发贴常用
    - +.imgchest.com           # 图片流 | 国际新兴贴图社区，近期在各论坛使用率飙升
    - +.qpic.ws                # 图片流 | 德国免费图片托管，支持大图直链
    - +.thumbsnap.com          # 图片流 | 国际免注册老牌图床，华人圈接受度高

    # =================================================================
    # 三、图床分发、后端 CDN 缓存与特殊流
    # =================================================================
    - +.redircdn.com           # 图片流 | 多数聚合图床后端使用的重定向/CDN图片加速节点
    - +.skyimg.net             # 图片流 | SKY Image Hosting 核心贴图分发链接
    - +.shortdomain.uk         # 图片流 | 修复原列表拼写错误，特定海外直链加速短域名
    - +.smmimg.com             # 图片流 | 专用贴图流分发域名
    - +.pichost.me             # 图片流 | 华人常用多聚合图床的公共衍生后缀
    - +.imgly.net              # 视频流 | 极少数发帖附带的短动态/短视频流分发节点
